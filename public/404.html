<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | MD SELIM</title>
    <meta name="description" content="The page you requested could not be found on mdselim.com. Explore Webflow development, SEO services, portfolio work, or contact MD Selim." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://mdselim.com/404/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg-canvas: #061411;
        --bg-elevated: #0B241F;
        --bg-interactive: #14332D;
        --accent-primary: #10B981;
        --text-primary: #F0FDF8;
        --text-secondary: #8DAAA2;
        --border-subtle: rgba(141, 170, 162, 0.14);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      main {
        max-width: 640px;
        width: 100%;
        background-color: var(--bg-elevated);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        padding: 2.5rem;
      }
      .kicker {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        color: var(--accent-primary);
        margin: 0 0 0.75rem 0;
      }
      h1 {
        font-size: clamp(1.75rem, 3vw, 2.5rem);
        margin: 0 0 1rem 0;
        line-height: 1.15;
      }
      p {
        color: var(--text-secondary);
        font-size: 0.95rem;
        line-height: 1.65;
        margin: 0 0 1.75rem 0;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        padding: 0.7rem 1.25rem;
        border-radius: 8px;
        background-color: var(--accent-primary);
        color: #04120E;
        font-weight: 600;
        font-size: 0.875rem;
        text-decoration: none;
      }
      .btn-secondary {
        display: inline-flex;
        align-items: center;
        padding: 0.7rem 1.25rem;
        border-radius: 8px;
        background-color: var(--bg-interactive);
        color: var(--text-primary);
        font-weight: 600;
        font-size: 0.875rem;
        text-decoration: none;
        border: 1px solid rgba(16, 185, 129, 0.28);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">HTTP 404 · Page Not Found</p>
      <h1>This page could not be found.</h1>
      <p>
        The URL you visited may have been moved or does not exist on <strong>mdselim.com</strong>. Use the links below to return to the homepage, review Webflow and SEO services, or get in touch.
      </p>
      <div class="links">
        <a href="/" class="btn-primary">Return to Homepage</a>
        <a href="/services/" class="btn-secondary">Explore Services</a>
        <a href="/work/" class="btn-secondary">View Work</a>
        <a href="/contact/" class="btn-secondary">Contact MD Selim</a>
      </div>
    </main>
  </body>
</html>
