<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        window.addEventListener(
          'error',
          function (event) {
            var msg = String((event && event.message) || '');
            var file = String((event && event.filename) || '');
            if (
              msg.indexOf('Cannot set property fetch') !== -1 ||
              file.indexOf('chrome-extension://') === 0
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );

        var patchTarget = function (target) {
          if (!target) return;
          try {
            var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
            if (desc && desc.configurable && !desc.set) {
              var currentFetch = desc.get ? desc.get.call(window) : desc.value;
              Object.defineProperty(target, 'fetch', {
                get: function () {
                  return currentFetch;
                },
                set: function (fn) {
                  if (typeof fn === 'function') {
                    currentFetch = fn;
                  }
                },
                configurable: true,
                enumerable: true,
              });
            }
          } catch (_e) {
            // Ignore if non-configurable
          }
        };

        patchTarget(window);
        if (typeof Window !== 'undefined' && Window.prototype) {
          patchTarget(Window.prototype);
        }
      })();
    </script>
    <title>MD SELIM — Websites Built for Clarity, Credibility, and Growth</title>
    <meta name="description" content="I help small service businesses build professional websites with a strong user experience and an SEO-ready foundation." />
    <meta property="og:title" content="MD SELIM — Websites Built for Clarity, Credibility, and Growth" />
    <meta property="og:description" content="I help small service businesses build professional websites with a strong user experience and an SEO-ready foundation." />

  </head>

</html>
